# Lia external uptime probe. See docs/DEPLOYMENT.md in philipemosv/party-up,
# "External uptime probe": it reports the VPS itself being down, which the
# on-host lia-watch cannot.
owner: philipemosv
repo: lia-status

sites:
  - name: Lia API
    url: https://api.playlia.com.br/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Lia Web
    url: https://playlia.com.br

assignees:
  - philipemosv

status-website:
  baseUrl: /lia-status
  name: Lia Status
  introTitle: "**Lia** status"
  introMessage: Uptime of the Lia API and web app, checked every 5 minutes.
  navbar:
    - title: Status
      href: /
